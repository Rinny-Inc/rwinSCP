[package]
name = "rwinSCP"
version = "0.9.3"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
ssh2 = "0.9.6"
suppaftp = "12.0.0"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
aws-config = "1.12.0"
aws-sdk-s3 = "1.146.0"
bytes = "1.12.1"
futures-util = "0.3.34"
chrono = "0.4.45"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7.0.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
keyring = "4.2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
