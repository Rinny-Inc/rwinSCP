[package]
name = "rwinSCP"
version = "0.9.14"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
ssh2 = "0.9.7"
libssh2-sys = "0.3.4"
suppaftp = "12.2.1"
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
aws-config = "1.13.2"
aws-sdk-s3 = "1.159.0"
bytes = "1.12.1"
futures-util = "0.3.34"
chrono = "0.4.45"
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
ureq = { version = "3.5.1", default-features = false, features = [
    "rustls",
    "json",
] }
keyring = "4.2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
