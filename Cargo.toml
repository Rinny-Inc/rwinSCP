[package]
name = "rwinSCP"
version = "0.9.0"
edition = "2024"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
ssh2 = "0.9.6"
suppaftp = "11.0.0"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
aws-config = "1.11.0"
aws-sdk-s3 = "1.144.0"
bytes = "1.12.1"
futures-util = "0.3.34"
chrono = "0.4.45"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.release]
opt-level = "z"     # optimize for size/mem footprint, not raw speed
lto = true
codegen-units = 1
panic = "abort"
strip = true
