[package]
name = "rwinSCP"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
ssh2 = "0.9.6"
suppaftp = "10.0.1"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
aws-config = "1.10.1"
aws-sdk-s3 = "1.142.0"
bytes = "1.12.1"
futures-util = "0.3.34"
chrono = "0.4.45"
rfd = "0.17.2"

[profile.release]
opt-level = "z"     # optimize for size/mem footprint, not raw speed
lto = true
codegen-units = 1
panic = "abort"
strip = true
